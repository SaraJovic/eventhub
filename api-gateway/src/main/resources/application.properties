server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=event-service
spring.cloud.gateway.server.webflux.routes[1].uri=${EVENT_SERVICE_URL:http://event-service:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/events/**

spring.cloud.gateway.server.webflux.routes[2].id=registration-service
spring.cloud.gateway.server.webflux.routes[2].uri=${REGISTRATION_SERVICE_URL:http://registration-service:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/registrations/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Tracing
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n
