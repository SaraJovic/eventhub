name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker images
        run: docker compose build

      - name: Verify all services start correctly
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 60
          docker compose ps

      - name: Check health of core services
        run: |
          HEALTHY=$(docker compose ps | grep -c "healthy")
          echo "Healthy services: $HEALTHY"
          if [ "$HEALTHY" -lt 5 ]; then
            echo "Not enough healthy services!"
            docker compose ps
            exit 1
          fi

      - name: Post-deploy health check
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused \
            http://localhost:8080/actuator/health || exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
