name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Create additional test databases
        run: psql -h localhost -U postgres -c "CREATE DATABASE event_db;"
        env:
          PGPASSWORD: postgres

      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/user_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f user-service/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: user-service/target/surefire-reports

  build-and-test-event:
    name: Build & Test (event-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: event-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/event_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -f pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-event
          path: event-service/target/surefire-reports

  build-and-test-notification:
    name: Build & Test (notification-service)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: notification-service
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: mvn -f pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-notification
          path: notification-service/target/surefire-reports

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-test-event, build-and-test-notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service Docker image
        run: |
          docker build -t eventhub/user-service:${{ github.sha }} ./user-service

      - name: Build event-service Docker image
        run: |
          docker build -t eventhub/event-service:${{ github.sha }} ./event-service

      - name: Build notification-service Docker image
        run: |
          docker build -t eventhub/notification-service:${{ github.sha }} ./notification-service

  static-analysis:
    name: Static Analysis (SonarCloud)
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-test-event, build-and-test-notification]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build project for analysis
        working-directory: user-service
        run: mvn -f pom.xml clean compile -DskipTests

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -f user-service/pom.xml sonar:sonar \
            -Dsonar.projectKey=eventhub_user-service \
            -Dsonar.organization=sarajovic \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Build event-service for analysis
        working-directory: event-service
        run: mvn -f pom.xml clean compile -DskipTests

      - name: Run SonarCloud analysis for event-service
        working-directory: event-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -f pom.xml sonar:sonar \
            -Dsonar.projectKey=eventhub_event-service \
            -Dsonar.organization=sarajovic \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Build notification-service for analysis
        working-directory: notification-service
        run: mvn -f pom.xml clean compile -DskipTests

      - name: Run SonarCloud analysis for notification-service
        working-directory: notification-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -f pom.xml sonar:sonar \
            -Dsonar.projectKey=eventhub_notification-service \
            -Dsonar.organization=sarajovic \
            -Dsonar.host.url=https://sonarcloud.io
